name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun add -g opencode-ai@1.18.30 pi-acp@0.0.33 @earendil-works/pi-coding-agent@0.87.1
      - run: bun run typecheck
      - run: bun test
        env:
          SHRIKE_LIVE: "1"
