<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greeter</title>
    <style>
      body { margin: 0; font: 16px system-ui, sans-serif; color: #1c1c1c; background: #f6f6f4; }
      main { max-width: 560px; margin: 64px auto; padding: 32px; background: #fff; border: 1px solid #e2e2df; border-radius: 12px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 20px; color: #666; }
      form { display: flex; gap: 8px; }
      input { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid #c9c9c4; border-radius: 8px; }
      button { padding: 10px 16px; font: inherit; color: #fff; background: #4f46e5; border: 0; border-radius: 8px; }
      #out { margin-top: 20px; font-size: 20px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Greeter</h1>
      <p>Type a name and the page greets it, the same way examples/greet.js does on the command line.</p>
      <form>
        <input id="name" placeholder="Your name" aria-label="Name" />
        <button type="submit">Greet</button>
      </form>
      <div id="out"></div>
    </main>
    <script>
      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = document.querySelector("#name").value.trim();
        document.querySelector("#out").textContent = name ? `Hello, ${name}!` : "Tell me your name first.";
      });
    </script>
  </body>
</html>
